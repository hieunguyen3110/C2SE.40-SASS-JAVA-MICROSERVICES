      environment:
        SPRING_SERVER_PORT: 8080
        EUREKA_CLIENT_DEFAULT_ZONE: http://discovery-server:8761/eureka/
        DISCOVERY_SERVER_HOST: discovery-server
        SPRING_REDIS_HOST: redis
        SPRING_REDIS_PORT: 6379
