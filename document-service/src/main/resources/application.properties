spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.connection.release_mode=after_transaction
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


server.port=${SPRING_SERVER_PORT}
spring.application.name=document-service
server.servlet.context-path=/api/v1/document
spring.servlet.multipart.max-file-size=${SPRING_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${SPRING_REQUEST_SIZE}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.config.import=optional:file:.env

firebase.bucket-name=${FIREBASE_BUCKET_NAME}
firebase.image-url=${FIREBASE_IMAGE_URL}

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

chatbot.url=${CHATBOT_URL}
recommendation.url=${RECOMMENDATION_URL}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

#config eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_DEFAULT_ZONE}

#redis connection
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}
spring.data.redis.password=${SPRING_REDIS_PASSWORD}

#circuit breaker config
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=60
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true

#Resilience4j Properties of identity service
resilience4j.circuitbreaker.instances.identity-service.base-config=default
resilience4j.circuitbreaker.instances.identity-service.waitDurationInOpenState=5s

#Resilience4j Properties of recommendation service
resilience4j.circuitbreaker.instances.recommendation-service.base-config=default
resilience4j.circuitbreaker.instances.recommendation-service.waitDurationInOpenState=5s

#Resilience4j Properties of chatbot service
resilience4j.circuitbreaker.instances.chatbot-service.base-config=default
resilience4j.circuitbreaker.instances.chatbot-service.waitDurationInOpenState=10s

#Resilience4J Timeout Properties
resilience4j.timelimiter.instances.default.timeout-duration=5s

#Resilience4J Timeout Properties chatbot service
resilience4j.timelimiter.instances.chatbot-service.timeout-duration=20s

#Resilience4J Retry Properties
resilience4j.retry.instances.default.max-attempts=3
resilience4j.retry.instances.default.wait-duration=5s